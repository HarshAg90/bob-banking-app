<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — BankApp</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <style>
    body {
      background-color: #f7f8fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
    }
    .login-card {
      border: 1px solid #e5e7eb;
      border-radius: 0.75rem;
    }
    .brand-header {
      background-color: #1a3a5c;
      border-radius: 0.75rem 0.75rem 0 0;
      padding: 1.5rem;
      text-align: center;
      color: #ffffff;
    }
    .brand-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin: 0;
    }
    .brand-header p {
      font-size: 0.85rem;
      color: #aecbeb;
      margin: 0.25rem 0 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5">

        <!-- Brand header -->
        <div class="brand-header">
          <h1>&#127981; BankApp</h1>
          <p>Secure Online Banking</p>
        </div>

        <!-- Login card -->
        <div class="card login-card border-top-0 rounded-top-0 shadow-sm">
          <div class="card-body p-4">
            <h2 class="card-title fs-5 mb-4 text-center text-secondary">Sign in to your account</h2>

            <!-- Flash messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category }} alert-dismissible fade show py-2" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <!-- Login form -->
            <form action="{{ url_for('login') }}" method="POST" novalidate>
              <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Username</label>
                <input
                  type="text"
                  class="form-control"
                  id="username"
                  name="username"
                  placeholder="Enter your username"
                  autocomplete="username"
                  required
                />
              </div>

              <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Password</label>
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  name="password"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                  required
                />
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                Sign In
              </button>
            </form>
          </div>
        </div>

        <p class="text-center text-muted mt-3" style="font-size:0.8rem;">
          Demo credentials: <code>demo_user</code> / <code>SecurePass123!</code>
        </p>

      </div>
    </div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmAIpWn0OEZBLOVLAYGBbgMwnMNd"
    crossorigin="anonymous"
  ></script>
</body>
</html>
